<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>현장 관리 · 팀원 일당</title>
  <meta name="description" content="팀원 · 현장 · 출역 · 일당 · 가불을 기기 안에서 관리하고 엑셀·정산서로 내보내는 앱" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="color-scheme" content="dark light" />

  <!-- 홈 화면에 추가했을 때 앱처럼 보이도록 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="현장관리" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <script>
    // 저장해 둔 테마를 스타일보다 먼저 적용해 첫 화면이 깜빡이지 않게 합니다.
    try {
      var t = localStorage.getItem('theme') || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      var fs = Number(localStorage.getItem('fontScale'));
      if (fs >= 0.9 && fs <= 1.45) document.documentElement.style.setProperty('--fs', String(fs));
    } catch (e) { /* 저장을 막아 둔 브라우저 */ }
  </script>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 스크립트가 실행되기 전에 보이는 첫 화면 -->
    <header class="topbar"><h1>현장 관리<span class="sub">불러오는 중…</span></h1></header>
    <main id="view">
      <div class="empty"><span class="big">🏗️</span><p>불러오는 중…</p></div>
    </main>
  </div>

  <noscript>
    <div style="padding:24px;text-align:center">
      이 앱을 사용하려면 자바스크립트를 켜 주세요.
    </div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
